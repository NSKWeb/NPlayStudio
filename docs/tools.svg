<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The nine NPlayStudio tools grouped by category. Video: compress, convert, merge, to GIF. Audio: extract, convert. Image: compress, convert, crop.">
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    .cat { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    .name{ fill: #e8ecff; font-size: 17px; font-weight: 600; }
    .sub { fill: #9aa6d4; font-size: 13px; }
    .box { fill: #161d3a; stroke: #2a3563; stroke-width: 1.5; }
  </style>

  <rect width="1200" height="470" rx="18" fill="#0b1020"/>
  <rect x="1" y="1" width="1198" height="468" rx="17" fill="none" stroke="#2a3563"/>

  <text x="48" y="54" fill="#e8ecff" font-size="22" font-weight="700">Nine tools, three categories</text>
  <text x="48" y="78" class="sub">Every tool is a POST endpoint that returns a task_id; the browser then polls and downloads.</text>

  <!-- VIDEO -->
  <text x="48" y="122" class="cat" fill="#4f7cff">VIDEO</text>
  <rect x="48" y="136" width="264" height="66" rx="11" class="box"/>
  <text x="72" y="164" class="name">Compress</text>
  <text x="72" y="185" class="sub">/api/video/compress</text>

  <rect x="330" y="136" width="264" height="66" rx="11" class="box"/>
  <text x="354" y="164" class="name">Convert</text>
  <text x="354" y="185" class="sub">/api/video/convert</text>

  <rect x="612" y="136" width="264" height="66" rx="11" class="box"/>
  <text x="636" y="164" class="name">Merge</text>
  <text x="636" y="185" class="sub">/api/video/merge</text>

  <rect x="894" y="136" width="258" height="66" rx="11" class="box"/>
  <text x="918" y="164" class="name">To GIF</text>
  <text x="918" y="185" class="sub">/api/video/to-gif</text>

  <!-- AUDIO -->
  <text x="48" y="256" class="cat" fill="#22c55e">AUDIO</text>
  <rect x="48" y="270" width="264" height="66" rx="11" class="box"/>
  <text x="72" y="298" class="name">Extract</text>
  <text x="72" y="319" class="sub">/api/audio/extract</text>

  <rect x="330" y="270" width="264" height="66" rx="11" class="box"/>
  <text x="354" y="298" class="name">Convert</text>
  <text x="354" y="319" class="sub">/api/audio/convert</text>

  <text x="612" y="312" class="sub">MP3 · M4A · WAV · FLAC · OPUS · AAC · OGG</text>

  <!-- IMAGE -->
  <text x="48" y="390" class="cat" fill="#f59e0b">IMAGE</text>
  <rect x="48" y="404" width="264" height="52" rx="11" class="box"/>
  <text x="72" y="437" class="name">Compress</text>

  <rect x="330" y="404" width="264" height="52" rx="11" class="box"/>
  <text x="354" y="437" class="name">Convert</text>

  <rect x="612" y="404" width="264" height="52" rx="11" class="box"/>
  <text x="636" y="437" class="name">Crop</text>

  <text x="894" y="437" class="sub">JPG · PNG · WebP · GIF · BMP · TIFF</text>
</svg>
