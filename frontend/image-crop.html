<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Crop — Crop to Exact Dimensions | NPlayStudio</title>
<meta name="description" content="Crop images to exact pixel dimensions online for free. Source dimensions are detected automatically and the crop is clamped to the image bounds.">
<link rel="canonical" href="/image-crop.html">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script src="/assets/app.js" defer></script>
</head>
<body>
<main class="wrap">
  <p class="breadcrumb"><a href="/">Dashboard</a> / Image Crop</p>
  <h1>Image Crop</h1>
  <p>Crop from any corner to an exact size. The width and height fields are pre-filled with the
     source dimensions, so you only change what you need.</p>

  <div class="card" data-tool data-endpoint="/api/image/crop">
    <div class="dropzone" data-dropzone tabindex="0" role="button" aria-label="Upload an image">
      <strong>Drop an image here, or click to browse</strong>
      <span>JPG, PNG, WebP, GIF, BMP, TIFF — up to 512 MB</span>
    </div>
    <input type="file" accept="image/*" hidden>
    <ul class="file-list" data-file-list></ul>
    <img class="preview" data-preview alt="Selected image preview" hidden>
    <p class="hint" data-dims></p>

    <form>
      <div class="row">
        <div class="field">
          <label for="x">Offset X (px)</label>
          <input type="number" id="x" name="x" min="0" value="0">
        </div>
        <div class="field">
          <label for="y">Offset Y (px)</label>
          <input type="number" id="y" name="y" min="0" value="0">
        </div>
        <div class="field">
          <label for="width">Width (px)</label>
          <input type="number" id="width" name="width" min="1" required>
        </div>
        <div class="field">
          <label for="height">Height (px)</label>
          <input type="number" id="height" name="height" min="1" required>
        </div>
        <div class="field">
          <label for="format">Output format</label>
          <select id="format" name="format">
            <option value="" selected>Keep original format</option>
            <option value="jpg">JPG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
          </select>
        </div>
      </div>
      <button type="submit" data-submit disabled>Crop image</button>
    </form>

    <div class="progress-wrap" data-progress-wrap hidden>
      <div class="progress-track"><div class="progress-bar" data-progress-bar></div></div>
      <div class="progress-meta">
        <span class="status-pill" data-status-pill data-status="queued">queued</span>
        <span data-progress-pct>0%</span>
      </div>
    </div>
    <div class="notice" data-notice hidden></div>
    <div data-result hidden></div>
  </div>
</main>
</body>
</html>
