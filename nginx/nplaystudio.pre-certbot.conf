# NPlayStudio — HTTP-only site config for the very first certbot run.
#
# certbot --nginx rewrites a *loading* config, so the first run needs a site
# that does not reference a certificate yet. scripts/vps-bootstrap.sh installs
# this file, runs certbot, and certbot then converts it into the HTTPS server
# block. Copy the full nginx/nginx.conf over it afterwards for the hardened
# settings (gzip, security headers, long proxy timeouts, /docs).

upstream nplaystudio_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nplaystudio.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /srv/nplaystudio/frontend;
    index index.html;

    client_max_body_size 600M;
    client_body_timeout 300s;

    location /api/ {
        proxy_pass http://nplaystudio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://nplaystudio_api/health;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://nplaystudio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
