# NPlayStudio — reverse proxy for the FastAPI app.
# Static files are served straight from disk; /api and /health are proxied.
#
# Install (Debian/Ubuntu):
#   sudo cp nginx/nginx.conf /etc/nginx/sites-available/nplaystudio
#   sudo ln -s /etc/nginx/sites-available/nplaystudio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then obtain a certificate:
#   sudo certbot --nginx -d nplaystudio.example.com

upstream nplaystudio_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirect plain HTTP to HTTPS once a certificate exists. Comment this block out
# for the very first certbot run so the ACME challenge can reach the server.
server {
    listen 80;
    listen [::]:80;
    server_name nplaystudio.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nplaystudio.example.com;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/nplaystudio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nplaystudio.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/nplaystudio/frontend;
    index index.html;

    # Uploads can be large; keep this above NPLAY_MAX_UPLOAD_MB.
    client_max_body_size 600M;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-lived immutable assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }

    location /api/ {
        proxy_pass http://nplaystudio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Long conversions stream progress; do not cut the connection early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://nplaystudio_api/health;
        access_log off;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
